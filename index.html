<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐINH VIỆT PHƯƠNG</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #080c14;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Hiệu ứng nền sao lấp lánh */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        }

        .star {
            position: absolute;
            background: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff;
            animation: blink 2s infinite ease-in-out alternate, fall 5s linear infinite;
        }

        @keyframes blink {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        @keyframes fall {
            0% { top: -10px; }
            100% { top: 100vh; }
        }

        /* Khung giao diện chính */
        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px 18px;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
            text-align: center;
            position: relative;
            z-index: 1;
            border: 2px solid transparent;
            animation: borderGlow 3s infinite alternate;
        }

        /* Viền LED lấp lánh đổi màu */
        @keyframes borderGlow {
            0% { box-shadow: 0 0 15px #38bdf8, inset 0 0 10px #38bdf8; border-color: #38bdf8; }
            50% { box-shadow: 0 0 25px #a855f7, inset 0 0 15px #a855f7; border-color: #a855f7; }
            100% { box-shadow: 0 0 15px #ec4899, inset 0 0 10px #ec4899; border-color: #ec4899; }
        }

        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Khung từng file gồm Ảnh + Tên + Nút Tải */
        .item-card {
            background: rgba(30, 41, 59, 0.9);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .item-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .item-title {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        .btn-download {
            display: inline-block;
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
            transition: all 0.2s ease;
        }

        .btn-download:active {
            transform: scale(0.96);
            background: #0284c7;
            box-shadow: 0 0 18px #0284c7;
        }

        /* Nút Bật/Tắt nhạc */
        .music-control {
            position: fixed;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a;
            border: none;
            padding: 10px 16px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
        }
    </style>
</head>
<body>

    <!-- Hiệu ứng sao lấp lánh -->
    <div class="stars" id="starContainer"></div>

    <!-- Nút Bật/Tắt Nhạc -->
    <button class="music-control" onclick="toggleMusic()" id="musicBtn">🎵 BẬT NHẠC REMIX</button>

    <!-- Nhạc nền ngầm -->
    <audio id="bgMusic" loop>
        <source src="https://commondatastorage.googleapis.com/codeskulptor-assets/Epoq-Lepidoptera.ogg" type="audio/ogg">
    </audio>

    <div class="container">

        <p class="subtitle">Bấm vào nút tải xuống bên dưới hình ảnh tương ứng</p>

        <div class="item-list">
            
            <!-- File 1: MTH V32 -->
            <div class="item-card">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600&auto=format&fit=crop&q=80" class="item-img" alt="MTH V32">
                <div class="item-title">MTH V32</div>
                <a href="https://link4sub.com/8Zfo4uF2M4" class="btn-download" target="_blank">TẢI XUỐNG</a>
            </div>

            <!-- File 2: PROXY V3 -->
            <div class="item-card">
                <img src="proxy-v3.jpg" class="item-img" alt="PROXY V3" onerror="this.src='https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600&auto=format&fit=crop&q=80'">
                <div class="item-title">PROXY V3</div>
                <a href="https://www.mediafire.com/file/37wv0m6i1aib58j/proxy-v3.apk/file?dkey=1m7mmd4gtfq&r=1718" class="btn-download" target="_blank">TẢI XUỐNG</a>
            </div>

            <!-- File 3: SUNNYMOD PROXY V1.3 -->
            <div class="item-card">
                <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=600&auto=format&fit=crop&q=80" class="item-img" alt="SUNNYMOD PROXY V1.3">
                <div class="item-title">SUNNYMOD PROXY V1.3</div>
                <a href="https://www.mediafire.com/file/fxtxbo6rqdgm6ze/SunnyMod_Proxy_V1.3.apk/file?dkey=xhaxw272wvy&r=1944" class="btn-download" target="_blank">TẢI XUỐNG</a>
            </div>

            <!-- File 4: YX PROXY CR -->
            <div class="item-card">
                <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&auto=format&fit=crop&q=80" class="item-img" alt="YX PROXY CR">
                <div class="item-title">YX PROXY CR</div>
                <a href="https://www.mediafire.com/file/79663moclbvvbqj/YX+Proxy+CR.apk/file" class="btn-download" target="_blank">TẢI XUỐNG</a>
            </div>

            <!-- File 5: DÂY KÍNH BẢN MỚI NHẤT (Zufile) -->
            <div class="item-card">
                <img src="https://images.unsplash.com/photo-1563089145-599997674d42?w=600&auto=format&fit=crop&q=80" class="item-img" alt="DÂY KÍNH BẢN MỚI NHẤT">
                <div class="item-title">DÂY KÍNH BẢN MỚI NHẤT</div>
                <a href="https://zufile.com/download/LHGBttZ9z7" class="btn-download" target="_blank">TẢI XUỐNG</a>
            </div>

        </div>
    </div>

    <script>
        // Tạo ngẫu nhiên hạt sao lấp lánh
        const starContainer = document.getElementById('starContainer');
        for (let i = 0; i < 35; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            let size = Math.random() * 4 + 2;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.animationDelay = Math.random() * 2 + 's';
            starContainer.appendChild(star);
        }

        // Bật/tắt nhạc
        var music = document.getElementById("bgMusic");
        var btn = document.getElementById("musicBtn");

        function toggleMusic() {
            if (music.paused) {
                music.play();
                btn.innerText = "🔇 TẮT NHẠC";
            } else {
                music.pause();
                btn.innerText = "🎵 BẬT NHẠC REMIX";
            }
        }
    </script>

</body>
</html>
